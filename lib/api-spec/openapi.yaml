openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: parking
    description: Parking lot availability
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /parking-lots:
    get:
      operationId: listParkingLots
      tags: [parking]
      summary: List parking lots
      description: Returns parking lots in the Fatih district.
      responses:
        "200":
          description: Parking lots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ParkingLot"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ParkingLot:
      type: object
      required:
        - id
        - name
        - lat
        - lng
        - capacity
        - free_spots
        - price_per_hour
        - hours
        - is_covered
        - has_ev_charging
        - updated_at
      properties:
        id:
          type: integer
        name:
          type: string
        lat:
          type: number
        lng:
          type: number
        capacity:
          type: integer
        free_spots:
          type: integer
        price_per_hour:
          type: number
        hours:
          type: string
        is_covered:
          type: boolean
        has_ev_charging:
          type: boolean
        updated_at:
          type: string
          format: date-time

